AWSTemplateFormatVersion: '2010-09-09'
Description: SageMaker AI real-time complaint classification workshop
Parameters:
  ArtifactBucket:
    Type: String
  ArtifactKey:
    Type: String
  ImageUri:
    Type: String
    Description: Immutable ECR image reference with a sha256 digest
    AllowedPattern: '.+@sha256:[a-f0-9]{64}'
  ImageRepositoryName:
    Type: String
  InstanceType:
    Type: String
    Default: ml.t2.medium
  ExistingModelExecutionRoleArn:
    Type: String
    Default: ''
    Description: Optional ModelExecutionRoleArn from the GitHub deployment IAM stack.
    AllowedPattern: '(^$|arn:[a-z0-9-]+:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+)'
  EnableDeploymentGuardrails:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  RollbackArtifactKey:
    Type: String
    Default: ''
    Description: Model archive key used by the currently deployed release
Conditions:
  CreateModelExecutionRole: !Equals [!Ref ExistingModelExecutionRoleArn, '']
  GuardedRelease: !Equals [!Ref EnableDeploymentGuardrails, 'true']
  HasRollbackArtifact: !And
    - !Condition GuardedRelease
    - !Not [!Equals [!Ref RollbackArtifactKey, '']]
Resources:
  ModelExecutionRole:
    Type: AWS::IAM::Role
    Condition: CreateModelExecutionRole
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LoadWorkshopModel
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/${ArtifactKey}'
              - !If
                - HasRollbackArtifact
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/${RollbackArtifactKey}'
                - !Ref AWS::NoValue
              - !If
                - GuardedRelease
                - Effect: Allow
                  Action: cloudwatch:DescribeAlarms
                  Resource: !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:*'
                - !Ref AWS::NoValue
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}'
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ImageRepositoryName}'
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !GetAtt EndpointLogs.Arn
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace:
                      - AWS/SageMaker
                      - /aws/sagemaker/Endpoints
  EndpointLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/sagemaker/Endpoints/${AWS::StackName}'
      RetentionInDays: 7
  Model:
    Type: AWS::SageMaker::Model
    Properties:
      ExecutionRoleArn: !If
        - CreateModelExecutionRole
        - !GetAtt ModelExecutionRole.Arn
        - !Ref ExistingModelExecutionRoleArn
      Tags:
        - Key: WorkshopStack
          Value: !Ref AWS::StackName
      EnableNetworkIsolation: true
      PrimaryContainer:
        Image: !Ref ImageUri
        ModelDataUrl: !Sub 's3://${ArtifactBucket}/${ArtifactKey}'
  EndpointConfig:
    Type: AWS::SageMaker::EndpointConfig
    Properties:
      Tags:
        - Key: WorkshopStack
          Value: !Ref AWS::StackName
      ProductionVariants:
        - VariantName: AllTraffic
          InitialInstanceCount: 1
          InitialVariantWeight: 1
          InstanceType: !Ref InstanceType
          ModelName: !GetAtt Model.ModelName
  CandidateModelLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: GuardedRelease
    Properties:
      AlarmName: !Sub '${AWS::StackName}-candidate-model-latency'
      AlarmDescription: Candidate configuration model latency during the guarded update
      Namespace: AWS/SageMaker
      MetricName: ModelLatency
      Dimensions:
        - Name: EndpointName
          Value: !Ref AWS::StackName
        - Name: VariantName
          Value: AllTraffic
        - Name: EndpointConfigName
          Value: !GetAtt EndpointConfig.EndpointConfigName
      Statistic: Average
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  Endpoint:
    Type: AWS::SageMaker::Endpoint
    Properties:
      EndpointName: !Ref AWS::StackName
      EndpointConfigName: !GetAtt EndpointConfig.EndpointConfigName
      DeploymentConfig: !If
        - GuardedRelease
        - AutoRollbackConfiguration:
            Alarms:
              - AlarmName: !Ref CandidateModelLatencyAlarm
          BlueGreenUpdatePolicy:
            TrafficRoutingConfiguration:
              Type: ALL_AT_ONCE
              WaitIntervalInSeconds: 0
            TerminationWaitInSeconds: 600
            MaximumExecutionTimeoutInSeconds: 1800
        - !Ref AWS::NoValue
Outputs:
  EndpointName:
    Value: !GetAtt Endpoint.EndpointName
  Logs:
    Value: !Ref EndpointLogs
  CandidateAlarmName:
    Condition: GuardedRelease
    Value: !Ref CandidateModelLatencyAlarm
